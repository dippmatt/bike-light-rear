# Enable device power management and system poweroff
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Enalble POSIX API for read-write locks
CONFIG_POSIX_API=y

# Enable console and RTT output
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

# Enable GPIO
CONFIG_GPIO=y

# Enable ADC
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# Enable PWM
CONFIG_PWM=y

# Enable work queue for button processing
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable I2C
CONFIG_I2C=y

# Enable sensors drivers
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_OPT3001=y

# Enable clock control (required for temperature sensor)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

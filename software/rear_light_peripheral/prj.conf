# Enable device power management and system poweroff
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# Software reset (sys_reboot) to recover from failed essential initialization
CONFIG_REBOOT=y

# Enable hardware info for reset reason detection
CONFIG_HWINFO=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Main thread runs the central state machine event loop
CONFIG_MAIN_STACK_SIZE=2048

# Enable console and RTT output
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

# Enable GPIO
CONFIG_GPIO=y

# Enable ADC
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# Enable PWM
CONFIG_PWM=y

# Enable work queue for button processing
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable I2C
CONFIG_I2C=y

# Enable sensors drivers
CONFIG_SENSOR=y
CONFIG_OPT3001=y
# LIS3DH accelerometer (st,lis2dh compatible); the driver defaults to y with
# the devicetree node enabled, stated explicitly so it cannot silently vanish
CONFIG_LIS2DH=y

# Enable clock control (required for temperature sensor)
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Bluetooth Low Energy Peripheral (Slave Mode)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="Zephyr GATT Write"

CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255

CONFIG_BT_L2CAP_TX_MTU=247